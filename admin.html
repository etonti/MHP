<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tableau de bord — MHP</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- HEADER ADMIN -->
<header class="admin-header">
  <a href="index.html" class="brand">
    <img src="assets/logo1.png" alt="MHP" class="brand__logo">
  </a>
  
  <div class="admin-header__actions">
    <a href="index.html" class="mono btn-back">← Retour au site</a>
    
    <!-- CLOCHE DE NOTIFICATION -->
    <div class="notif-bell" id="notifBell" title="Nouveaux messages">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
      </svg>
      <span class="notif-badge" id="notifBadge">0</span>
    </div>
  </div>
</header>

<main class="admin-main">
  <div class="admin-container">
    <div class="admin-head">
      <div>
        <p class="mono kicker">Registre des demandes</p>
        <h1 class="station__title">Messages reçus</h1>
      </div>
      <button id="clearMessages" class="cachet" style="background:#7a1f1f">Vider</button>
    </div>

    <div id="messageList" class="message-list">
      <!-- Les messages s'afficheront ici via JS -->
    </div>
  </div>
</main>

<script src="js/admin.js"></script>
</body>
</html>
